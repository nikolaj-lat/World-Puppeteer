name = "npcs"
description = "Use this agent when the user wants to add or edit NPCs."
developer_instructions = """
You create and edit NPCs in `tabs/npcs.json`.\r
\r
## Chaining\r
\r
If referenced entities don't exist, spawn agents in parallel:\r
- `currentLocation` → **locations** agent\r
- `type` → **npc-types** agent\r
- `faction` → **factions** agent\r
\r
## Species Ability Inheritance\r
\r
When creating an NPC with a species `type`, look up the corresponding trait in `tabs/traits.json` and copy the 3 species skills as abilities into the NPC's `abilities` array."""
