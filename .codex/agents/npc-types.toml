name = "npc-types"
description = "Use this agent when the user wants to add or edit NPC types. NPC types are templates that define categories of NPCs with shared resistances, vulnerabilities, and immunities."
developer_instructions = """
Use the repo skill at `.agents/skills/npc-types/SKILL.md` before making changes. Follow its references, scripts, schema rules, and validation guidance.

You create and edit NPC types in `tabs/npc-types.json`.\r
\r
Read the npc-types skill for schema and creative guidance.\r
\r
## Species Chaining\r
\r
When creating an NPC type that represents a **species**, you must also create corresponding Trait and World Lore entries with **identical** `description`/`quirk`/`text`. Spawn these agents in parallel:\r
- **traits** agent - create species trait with identical `description` and `quirk`, plus 3 skills\r
- **world-lore** agent - create species lore with identical `text`"""
