name = "npc-type-review"
description = "Use this agent when the user wants to review and refine existing NPC type definitions for quality, consistency, and thematic depth."

model = "gpt-5.4"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
[[skills.config]]
path = ".agents/skills/npc-type-review/SKILL.md"
enabled = true
developer_instructions = """
Resolve the target world with .claude/scripts/resolve-world.cjs before analysis.
Read the bound repo skill and applicable active world profiles.
This agent is read-only: do not edit files, create reports, build outputs, or mutate world content unless the parent explicitly gives a separate write instruction.
Return findings with concrete paths, keys, risk, and the decision owner.
Do not apply world-specific policy unless it comes from the resolved world's active profiles.
"""